[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options"
version = "0.2.1"
description = "Production-ready optimal option portfolio optimizer (paper-faithful baseline + extensible package API)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Sachin <sachncs@gmail.com>"}
]
keywords = [
  "portfolio-optimization",
  "option-pricing",
  "risk-management",
  "cvar",
  "quantitative-finance",
  "optimization",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2.6",
  "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sachncs/optimal-option-portfolios"
Repository = "https://github.com/sachncs/optimal-option-portfolios"
Issues = "https://github.com/sachncs/optimal-option-portfolios/issues"
Changelog = "https://github.com/sachncs/optimal-option-portfolios/blob/main/CHANGELOG.md"

[project.optional-dependencies]
yaml = [
  "pyyaml>=6.0",
]
dev = [
  "pytest>=9.1.1",
  "mypy>=1.10",
  "ruff>=0.6",
]
bench = [
  "pytest-benchmark>=4.0",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
]

[project.scripts]
options = "options.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["options*"]
exclude = ["tests*", "scripts*", "build*", "dist*", "*.egg-info*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
follow_imports = "silent"
