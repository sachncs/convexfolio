name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,hf-data]"

      - name: Run release quality gate
        run: |
          ruff check convexfolio tests scripts benchmarks
          mypy convexfolio
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov.plugin \
            --cov=convexfolio --cov-branch --cov-report=json:coverage.json \
            --cov-fail-under=90 -q tests/
          python scripts/check_coverage.py coverage.json
          python scripts/check_site.py
          python scripts/check_docs.py

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build documentation site
        working-directory: site
        run: npm ci && npm run check && npm run build

      - name: Build artifacts
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
