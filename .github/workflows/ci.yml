name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check convexfolio tests scripts benchmarks

      - name: Mypy
        run: mypy convexfolio

      - name: Pytest
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0
          python -m build

      - name: Install wheel smoke test
        run: |
          pip install dist/*.whl
          convexfolio --command print-report > /tmp/oop_report.json
