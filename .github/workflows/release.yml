name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,hf-data]"

      - name: Run release quality gate
        run: |
          ruff check convexfolio tests scripts benchmarks
          mypy convexfolio
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov.plugin \
            --cov=convexfolio --cov-branch --cov-report=json:coverage.json \
            --cov-fail-under=90 -q tests/
          python scripts/check_coverage.py coverage.json
          python scripts/check_site.py
          python scripts/check_release.py
          python scripts/check_docs.py
          python scripts/check_doc_examples.py

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build documentation site
        working-directory: site
        run: npm ci && npm run check && npm run build

      - name: Build artifacts
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
