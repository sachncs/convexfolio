name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check site invariants
        run: python scripts/check_site.py

      - name: Check local documentation links
        run: python scripts/check_docs.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Astro dependencies
        working-directory: site
        run: npm ci

      - name: Check Astro site
        working-directory: site
        run: npm run check

      - name: Build Astro site
        working-directory: site
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,hf-data]"

      - name: Ruff
        run: ruff check convexfolio tests scripts benchmarks

      - name: Mypy
        run: mypy convexfolio

      - name: Pytest
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p pytest_cov.plugin \
            --cov=convexfolio --cov-branch --cov-report=term-missing \
            --cov-report=json:coverage.json --cov-fail-under=90 -q tests/
          python scripts/check_coverage.py coverage.json

      - name: Benchmarks
        run: pytest --benchmark-only --benchmark-columns=mean benchmarks/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0
          python -m build

      - name: Install wheel smoke test
        run: |
          pip install dist/*.whl
          convexfolio --command print-report > /tmp/oop_report.json
